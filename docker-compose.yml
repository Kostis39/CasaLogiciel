
services:
  # ===== BASE DE DONNÉES =====
  mariadb:
    image: mariadb:latest
    container_name: mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_NAME}
    volumes:
      - ./bdd/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - mariadb_data:/var/lib/mysql
    networks:
      casa_network:
        ipv4_address: 172.20.0.2
    # Pas de port publié : MariaDB n'est joignable que par les conteneurs
    # du réseau interne casa_network (backend, phpmyadmin, metabase, backup).
    # Accès ponctuel depuis l'hôte :
    #   docker compose exec mariadb mariadb -u root -p
    # Ou temporairement : docker compose up -d mariadb --publish 127.0.0.1:3306:3306
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-p${MARIADB_PASSWORD}"]
      timeout: 20s
      retries: 10
      start_period: 40s
    restart: always

  # ===== BACKUP DE LA BASE DE DONNÉES =====
  mariadb-backup:
    image: alpine:3.19
    container_name: mariadb-backup
    environment:
      DB_HOST: mariadb
      DB_PORT: ${MARIADB_PORT}
      DB_NAME: ${MARIADB_NAME}
      DB_USER: ${MARIADB_USER}
      DB_PASS: ${MARIADB_PASSWORD}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TZ: Europe/Paris
    volumes:
      - /home/casamur/backups:/backups  # Dossier pour stocker les backups
      - /home/casamur/scripts:/scripts:ro  # Scripts en lecture seule
    command: >
      'sh' '-c' '
        apk add --no-cache mariadb-client tzdata && 
        echo "0 2 * * * /scripts/backup_mariadb.sh >/dev/null 2>&1" > /var/spool/cron/crontabs/root &&
        chmod 600 /var/spool/cron/crontabs/root && 
        crond -f -L /var/log/cron.log
      '
    networks:
      casa_network:
        ipv4_address: 172.20.0.6
    depends_on:
      mariadb:
        condition: service_healthy
    restart: always


  # ===== PHPMYADMIN =====
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    environment:
      PMA_HOST: mariadb
      PMA_USER: ${MARIADB_USER}
      PMA_PASSWORD: ${MARIADB_PASSWORD}
    # phpMyAdmin réservé à l'administration : uniquement accessible depuis
    # l'hôte (127.0.0.1), pas depuis le réseau local/Internet.
    # Accès distant recommandé : tunnel SSH (ssh -L 8080:127.0.0.1:8080 serveur)
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      casa_network:
        ipv4_address: 172.20.0.3
    restart: always

  # ===== BACKEND =====
  backend:
    image: casabackend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: casabackend
    # API consommée par le frontend (navigateur des postes clients) : doit
    # rester joignable sur le réseau. L'authentification Bearer protège les routes.
    ports:
      - "5000:5000"
    environment:
      # Variables depuis le .env racine
      DB_HOST: mariadb
      DB_PORT: ${MARIADB_PORT}
      DB_PASSWORD: ${MARIADB_PASSWORD}
      DB_NAME: ${MARIADB_NAME}
      DB_USER: ${MARIADB_USER}
      ENV: prod
      # Authentification API : même valeur que NEXT_PUBLIC_PASSWORD + secret de signature
      AUTH_PASSWORD: ${NEXT_PUBLIC_PASSWORD}
      AUTH_SECRET: ${AUTH_SECRET}
    volumes:
      - /home/casamur/data/signatures:/code/static/uploads/signatures
    networks:
      casa_network:
        ipv4_address: 172.20.0.4
    depends_on:
      mariadb:
        condition: service_healthy
    restart: always

  # ===== FRONTEND =====
  frontend:
    image: casafrontend:latest
    container_name: casafrontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL_PROD=${NEXT_PUBLIC_API_URL_PROD}
        - NEXT_PUBLIC_PASSWORD=${NEXT_PUBLIC_PASSWORD}
        - NEXT_PUBLIC_ENV=prod
        - NEXT_PUBLIC_METABASE_URL=${NEXT_PUBLIC_METABASE_URL}
    ports:
      - "3000:3000"
    networks:
      casa_network:
        ipv4_address: 172.20.0.5
    depends_on:
      - backend
    restart: always

  # ===== METABASE (OUTILS D'ANALYSE DE DONNEES) =====
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    hostname: metabase
    volumes:
      - /dev/urandom:/dev/random:ro
    # Metabase réservé à l'analyse : uniquement accessible depuis l'hôte.
    # Accès distant recommandé : tunnel SSH (ssh -L 4000:127.0.0.1:4000 serveur)
    ports:
      - "127.0.0.1:4000:3000"
    environment:
      MB_DB_TYPE: mysql
      MB_DB_DBNAME: metabaseappdb
      MB_DB_PORT: ${MARIADB_PORT}
      MB_DB_USER: ${MARIADB_USER}
      MB_DB_PASS: ${MARIADB_PASSWORD}
      MB_DB_HOST: mariadb
    networks:
      casa_network:
        ipv4_address: 172.20.0.7
    depends_on:
      mariadb:
        condition: service_healthy
    restart: always

volumes:
  mariadb_data:
    driver: local

networks:
  casa_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
