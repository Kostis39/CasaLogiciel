version: '3.8'

services:
  # ===== BASE DE DONNÉES =====
  mariadb:
    image: mariadb:latest
    container_name: mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_NAME}
    volumes:
      - ./bdd/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - mariadb_data:/var/lib/mysql
    networks:
      - casa_network
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-p${MARIADB_PASSWORD}"]
      timeout: 20s
      retries: 10
      start_period: 40s
    restart: always

  # ===== PHPMYADMIN =====
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    environment:
      PMA_HOST: mariadb
      PMA_USER: ${MARIADB_USER}
      PMA_PASSWORD: ${PMA_PASSWORD}
    ports:
      - "8080:80"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      casa_network:
        ipv4_address: 172.20.0.3
    restart: unless-stopped

  # ===== BACKEND =====
  backend:
    image: casabackend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: casabackend
    ports:
      - "5000:5000"
    environment:
      # Variables depuis le .env racine
      DB_HOST: mariadb
      DB_PORT: ${MARIADB_PORT}
      DB_PASSWORD: ${MARIADB_PASSWORD}
      DB_NAME: ${MARIADB_NAME}
      DB_USER: ${MARIADB_USER}
      ENV: ${ENV}
    volumes:
      - /home/casamur/data/signatures:/code/static/uploads/signatures
    networks:
      casa_network:
        ipv4_address: 172.20.0.4
    depends_on:
      mariadb:
        condition: service_healthy

  # ===== FRONTEND =====
  frontend:
    image: casafrontend:latest
    container_name: casafrontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    networks:
      casa_network:
        ipv4_address: 172.20.0.5
    depends_on:
      - backend

volumes:
  mariadb_data:
    driver: local

networks:
  casa_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
