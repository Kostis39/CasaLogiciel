# Configuration Apache de phpMyAdmin :
# 1. Basic Auth HTTP (htpasswd) — première barrière
# 2. phpMyAdmin exige ensuite le login MySQL (aucun auto-login)

LoadModule authn_file_module modules/mod_authn_file.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule headers_module modules/mod_headers.so

<VirtualHost *:80>
    ServerAdmin admin@casalogiciel.local
    DocumentRoot /var/www/html/

    <Directory /var/www/html/>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Protection Basic Auth sur TOUT le site phpMyAdmin
    <Directory /var/www/html/>
        AuthType Basic
        AuthName "phpMyAdmin - Acces restreint"
        AuthUserFile /etc/apache2/auth/htpasswd
        Require valid-user
    </Directory>

    # Headers de sécurité
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
</VirtualHost>
