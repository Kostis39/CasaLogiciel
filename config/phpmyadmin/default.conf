# Configuration Apache de phpMyAdmin (image officielle phpmyadmin:X, base php:apache) :
# 1. Basic Auth HTTP (htpasswd) — première barrière
# 2. phpMyAdmin exige ensuite le login MySQL (aucun auto-login)
#
# NB : PAS de directive LoadModule ici — les modules authn_file, auth_basic et
# headers sont déjà chargés par l'image (a2enmod dans le Dockerfile officiel /
# php:apache). Sur l'image phpmyadmin, les modules vivent dans
# /usr/local/apache2/modules ; un "LoadModule modules/mod_headers.so" avec un
# chemin relatif tente /etc/apache2/modules/ qui n'existe pas → Apache refuse
# de démarrer (cf. log "Cannot load modules/mod_headers.so").
# Si mod_headers était désactivé, l'activer via un Dockerfile (RUN a2enmod headers).

<VirtualHost *:80>
    ServerAdmin admin@casalogiciel.local
    DocumentRoot /var/www/html/

    <Directory /var/www/html/>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Protection Basic Auth sur TOUT le site phpMyAdmin
    <Directory /var/www/html/>
        AuthType Basic
        AuthName "phpMyAdmin - Acces restreint"
        AuthUserFile /etc/apache2/auth/htpasswd
        Require valid-user
    </Directory>

    # Headers de sécurité
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
</VirtualHost>
